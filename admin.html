<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Lote de Autos</title>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #0b0d0f; color: #fff; font-family: Arial, sans-serif; padding: 15px; max-width: 800px; margin: 0 auto; }
    h1, h2 { color: #f39c12; text-align: center; }
    .card { background: #14171a; padding: 20px; border-radius: 8px; border: 1px solid #262b30; margin-bottom: 25px; }
    .form-group { margin-bottom: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; color: #ccc; font-size: 14px; }
    input, textarea, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #262b30; background: #1b1f23; color: #fff; }
    input:disabled { background: #0f1113; color: #777; cursor: not-allowed; }
    button { background: #f39c12; color: #000; font-weight: bold; padding: 12px; border: none; width: 100%; border-radius: 6px; cursor: pointer; font-size: 15px; }
    button:hover { background: #e08e0b; }
    .btn-cancel { background: #555; color: #fff; margin-top: 8px; }
    .btn-cancel:hover { background: #666; }
    
    #loginCard { max-width: 400px; margin: 50px auto; }
    #adminPanel { display: none; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-logout { background: #e74c3c; color: #fff; width: auto; padding: 8px 15px; }

    .item-row { display: flex; align-items: center; justify-content: space-between; background: #1b1f23; padding: 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #262b30; flex-wrap: wrap; gap: 10px; }
    .item-info { flex: 1; min-width: 200px; }
    .item-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 4px; width: auto; font-weight: bold; }
    .btn-edit { background: #3498db; color: #fff; }
    .btn-disp { background: #27ae60; color: #fff; }
    .btn-apar { background: #f39c12; color: #000; }
    .btn-vend { background: #e74c3c; color: #fff; }
    .btn-del { background: #7f8c8d; color: #fff; }
    .btn-qr { background: #9b59b6; color: #fff; }

    #qrModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: #fff; color: #000; padding: 20px; border-radius: 8px; text-align: center; max-width: 320px; }
    @media print {
      body * { visibility: hidden; }
      #qrModal, #qrModal * { visibility: visible; }
      #qrModal { position: absolute; left: 0; top: 0; width: 100%; background: #fff; }
      .no-print { display: none; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <!-- INICIO DE SESIÓN -->
  <div id="loginCard" class="card">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Correo Electrónico:</label>
        <input type="email" id="loginEmail" required placeholder="correo@ejemplo.com">
      </div>
      <div class="form-group">
        <label>Contraseña:</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      <button type="submit" id="btnLogin">Entrar al Panel</button>
    </form>
  </div>

  <!-- PANEL DE ADMINISTRACIÓN -->
  <div id="adminPanel">
    <div class="header-bar">
      <h1>PANEL DE ADMINISTRACIÓN</h1>
      <button onclick="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
    </div>

    <!-- FORMULARIO DE REGISTRO / EDICIÓN -->
    <div class="card">
      <h2 id="formTitle">Agregar Nueva Unidad</h2>
      <form id="carForm">
        <div class="form-group">
          <label>ID / Clave (#X35, #A3):</label>
          <input type="text" id="id" required placeholder="ej. X35">
        </div>
        
        <div class="grid-2">
          <div class="form-group">
            <label>Marca:</label>
            <input type="text" id="marca" required placeholder="ej. BAIC">
          </div>
          <div class="form-group">
            <label>Modelo:</label>
            <input type="text" id="modelo" required placeholder="ej. X35">
          </div>
        </div>

        <div class="form-group">
          <label>Año:</label>
          <input type="number" id="anio" required placeholder="ej. 2023">
        </div>

        <!-- ESPECIFICACIONES TÉCNICAS (SPECS) -->
        <h3 style="color:#f39c12; font-size: 15px; margin-top: 15px;">Ficha Técnica (Specs)</h3>
        
        <div class="grid-2">
          <div class="form-group">
            <label>Color:</label>
            <input type="text" id="specColor" required placeholder="ej. Blanco">
          </div>
          <div class="form-group">
            <label>Motor:</label>
            <input type="text" id="specMotor" required placeholder="ej. 1.5L 4 cil.">
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Precio ($ MXN sin comas):</label>
            <input type="number" id="specPrecio" required placeholder="ej. 215000">
          </div>
          <div class="form-group">
            <label>Potencia:</label>
            <input type="text" id="specPotencia" required placeholder="ej. 113 hp">
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Tracción:</label>
            <input type="text" id="specTraccion" required placeholder="ej. Delantera">
          </div>
          <div class="form-group">
            <label>Kilometraje (número sin comas):</label>
            <input type="number" id="specKm" required placeholder="ej. 42000">
          </div>
        </div>

        <div class="form-group">
          <label>Transmisión:</label>
          <input type="text" id="specTransmision" required placeholder="ej. CVT / Automática">
        </div>

        <!-- FOTOS -->
        <h3 style="color:#f39c12; font-size: 15px; margin-top: 15px;">Fotografías</h3>
        <div class="form-group">
          <label id="lblPortada">Foto de Portada (1 sola foto principal):</label>
          <input type="file" id="fotoPortada" accept="image/*">
        </div>
        <div class="form-group">
          <label id="lblGaleria">Galería de Fotos (puedes seleccionar varias):</label>
          <input type="file" id="fotosGaleria" accept="image/*" multiple>
        </div>

        <!-- DESCRIPCIÓN Y PUNTOS CLAVE -->
        <div class="form-group">
          <label>Descripción / Puntos Clave (separados por coma):</label>
          <textarea id="descripcion" rows="3" placeholder="Factura Original, Único dueño, Servicios de agencia, Pagos al corriente"></textarea>
        </div>

        <button type="submit" id="btnGuardar">Guardar y Publicar</button>
        <button type="button" id="btnCancelar" class="btn-cancel" style="display:none;" onclick="cancelarEdicion()">Cancelar Edición</button>
      </form>
    </div>

    <!-- INVENTARIO -->
    <div class="card">
      <h2>Inventario de Unidades</h2>
      <div id="listaInventario">Cargando inventario...</div>
    </div>
  </div>

  <!-- MODAL QR -->
  <div id="qrModal">
    <div class="modal-content">
      <h3 id="qrTitulo" style="margin-top:0;">Ficha del Auto</h3>
      <div id="qrcode" style="display:flex; justify-content:center; margin: 15px 0;"></div>
      <p style="font-size: 12px;">Escanéame para ver detalles completos en línea</p>
      
      <button onclick="descargarQR()" class="no-print" style="margin-bottom:8px; background:#3498db; color:#fff;">💾 Descargar Imagen QR</button>
      <button onclick="window.print()" class="no-print" style="margin-bottom:8px; background:#27ae60; color:#fff;">🖨️ Imprimir QR</button>
      <button onclick="cerrarQR()" class="no-print btn-del">Cerrar</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://xkhoorjntavmzhuikauj.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhraG9vcmpudGF2bXpodWlrYXVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3ODY2OTMsImV4cCI6MjEwMzM2MjY5M30.PHBKRKmvDtFMSE0Csy01Qo82s9e8DKXWBicf7JrSHz4"; 
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const BASE_URL_CATALOGO = "https://roasaldivar28-dev.github.io/Cat-logo/";

    let editandoId = null;
    let fotosExistentes = { portada: '', galeria: [] };
    let idActualQR = '';
    let inventarioLocal = [];

    // Verificación de sesión al iniciar
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) mostrarPanel();
        else mostrarLogin();
      } catch (err) {
        console.error("Error comprobando sesión:", err);
        mostrarLogin();
      }
    });

    // Evento Formulario Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.innerText = "Iniciando sesión...";
      btn.disabled = true;

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          alert("Error de autenticación: " + error.message);
          btn.innerText = "Entrar al Panel";
          btn.disabled = false;
        } else {
          mostrarPanel();
        }
      } catch (err) {
        alert("Error de conexión: " + err.message);
        btn.innerText = "Entrar al Panel";
        btn.disabled = false;
      }
    });

    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      mostrarLogin();
    }

    function mostrarPanel() {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      cargarInventario();
    }

    function mostrarLogin() {
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
    }

    async function cargarInventario() {
      const contenedor = document.getElementById('listaInventario');
      const { data: carros, error } = await supabaseClient.from('carros').select('*');
      
      if(error) {
        contenedor.innerHTML = "<p style='color:#e74c3c'>Error al cargar inventario: " + error.message + "</p>";
        return;
      }

      inventarioLocal = carros || [];

      if(!carros || carros.length === 0) {
        contenedor.innerHTML = "<p>No hay carros registrados aún.</p>";
        return;
      }

      contenedor.innerHTML = carros.map(c => `
        <div class="item-row">
          <div class="item-info">
            <strong>${c.marca} ${c.modelo} (${c.anio})</strong> - #${c.id}<br>
            <small>Estado: <span style="color:#f39c12">${c.estado || 'DISPONIBLE'}</span></small>
          </div>
          <div class="item-actions">
            <button class="btn-sm btn-edit" onclick="prepararEdicion('${c.id}')">✏️ Editar</button>
            <button class="btn-sm btn-disp" onclick="cambiarEstado('${c.id}', 'DISPONIBLE')">Dispo</button>
            <button class="btn-sm btn-apar" onclick="cambiarEstado('${c.id}', 'APARTADO')">Apart</button>
            <button class="btn-sm btn-vend" onclick="cambiarEstado('${c.id}', 'VENDIDO')">Vend</button>
            <button class="btn-sm btn-qr" onclick="generarQR('${c.id}')">QR</button>
            <button class="btn-sm btn-del" onclick="eliminarCarro('${c.id}')">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    async function subirImagen(file) {
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}_${file.name.replace(/\s+/g, '_')}`;
      const { error: storageError } = await supabaseClient.storage.from('fotos-carros').upload(fileName, file);
      if (storageError) throw storageError;

      const { data: publicUrlData } = supabaseClient.storage.from('fotos-carros').getPublicUrl(fileName);
      return publicUrlData.publicUrl;
    }

    // Funciones de formato exacto para Specs
    function formatearPrecio(val) {
      const num = parseInt(val) || 0;
      return '$' + num.toLocaleString('en-US') + ' MXN';
    }

    function formatearKm(val) {
      const num = parseInt(val) || 0;
      return num.toLocaleString('en-US') + ' km';
    }

    async function prepararEdicion(id) {
      const carro = inventarioLocal.find(item => item.id == id);
      if (!carro) return;

      editandoId = id;
      fotosExistentes = { portada: carro.portada || '', galeria: carro.fotos || [] };

      document.getElementById('id').value = carro.id;
      document.getElementById('id').disabled = true;
      document.getElementById('marca').value = carro.marca || '';
      document.getElementById('modelo').value = carro.modelo || '';
      document.getElementById('anio').value = carro.anio || '';
      
      const specs = carro.specs || {};

      // Extraer solo dígitos de las cadenas para rellenar los inputs numéricos
      const rawPrecio = specs["Precio"] ? specs["Precio"].replace(/[^0-9]/g, '') : '';
      const rawKm = specs["Kilometraje"] ? specs["Kilometraje"].replace(/[^0-9]/g, '') : '';

      document.getElementById('specColor').value = specs["Color"] || '';
      document.getElementById('specMotor').value = specs["Motor"] || '';
      document.getElementById('specPrecio').value = rawPrecio;
      document.getElementById('specPotencia').value = specs["Potencia"] || '';
      document.getElementById('specTraccion').value = specs["Tracción"] || '';
      document.getElementById('specKm').value = rawKm;
      document.getElementById('specTransmision').value = specs["Transmisión"] || '';

      document.getElementById('descripcion').value = carro.descripcion || '';

      document.getElementById('formTitle').innerText = `Editar Unidad #${id}`;
      document.getElementById('btnGuardar').innerText = "Actualizar Unidad";
      document.getElementById('btnCancelar').style.display = "block";
      document.getElementById('lblPortada').innerText = "Foto de Portada (deja vacío para conservar la actual):";
      document.getElementById('lblGaleria').innerText = "Galería de Fotos (deja vacío para conservar las actuales):";

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicion() {
      editandoId = null;
      fotosExistentes = { portada: '', galeria: [] };
      document.getElementById('carForm').reset();
      document.getElementById('id').disabled = false;
      document.getElementById('formTitle').innerText = "Agregar Nueva Unidad";
      document.getElementById('btnGuardar').innerText = "Guardar y Publicar";
      document.getElementById('btnCancelar').style.display = "none";
      document.getElementById('lblPortada').innerText = "Foto de Portada (1 sola foto principal):";
      document.getElementById('lblGaleria').innerText = "Galería de Fotos (puedes seleccionar varias):";
    }

    // Evento guardar o actualizar carro
    document.getElementById('carForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnGuardar');
      btn.innerText = "Procesando...";
      btn.disabled = true;

      try {
        const portadaInput = document.getElementById('fotoPortada');
        const galeriaInput = document.getElementById('fotosGaleria');

        let portadaUrl = fotosExistentes.portada;
        let fotosGaleriaUrls = fotosExistentes.galeria;

        if (portadaInput.files.length > 0) {
          portadaUrl = await subirImagen(portadaInput.files[0]);
        } else if (!editandoId && portadaInput.files.length === 0) {
          throw new Error("Debes seleccionar una foto de portada.");
        }

        if (galeriaInput.files.length > 0) {
          const nuevasFotos = [];
          for (let i = 0; i < galeriaInput.files.length; i++) {
            const url = await subirImagen(galeriaInput.files[i]);
            nuevasFotos.push(url);
          }
          fotosGaleriaUrls = nuevasFotos;
        }

        const rawPrecio = document.getElementById('specPrecio').value;
        const rawKm = document.getElementById('specKm').value;

        // Formato exacto del JSON de specs
        const specsJson = {
          "Color": document.getElementById('specColor').value.trim(),
          "Motor": document.getElementById('specMotor').value.trim(),
          "Precio": formatearPrecio(rawPrecio),
          "Potencia": document.getElementById('specPotencia').value.trim(),
          "Tracción": document.getElementById('specTraccion').value.trim(),
          "Kilometraje": formatearKm(rawKm),
          "Transmisión": document.getElementById('specTransmision').value.trim()
        };

        const datosCarro = {
          id: document.getElementById('id').value.trim(),
          marca: document.getElementById('marca').value.trim(),
          modelo: document.getElementById('modelo').value.trim(),
          anio: parseInt(document.getElementById('anio').value),
          portada: portadaUrl,
          fotos: fotosGaleriaUrls,
          specs: specsJson,
          descripcion: document.getElementById('descripcion').value.trim()
        };

        if (editandoId) {
          const { error: updateError } = await supabaseClient.from('carros').update(datosCarro).eq('id', editandoId);
          if (updateError) throw updateError;
          alert("¡Unidad actualizada correctamente!");
        } else {
          datosCarro.estado = 'DISPONIBLE';
          const { error: insertError } = await supabaseClient.from('carros').insert([datosCarro]);
          if (insertError) throw insertError;
          alert("¡Vehículo publicado correctamente!");
        }

        cancelarEdicion();
        cargarInventario();
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        btn.innerText = editandoId ? "Actualizar Unidad" : "Guardar y Publicar";
        btn.disabled = false;
      }
    });

    async function cambiarEstado(id, nuevoEstado) {
      const { error } = await supabaseClient.from('carros').update({ estado: nuevoEstado }).eq('id', id);
      if(error) alert("Error al actualizar estado: " + error.message);
      else cargarInventario();
    }

    async function eliminarCarro(id) {
      if(confirm(`¿Seguro que deseas eliminar el carro #${id}?`)) {
        const { error } = await supabaseClient.from('carros').delete().eq('id', id);
        if(error) alert("Error al eliminar: " + error.message);
        else cargarInventario();
      }
    }

    function generarQR(id) {
      idActualQR = id;
      const carro = inventarioLocal.find(item => item.id == id);
      const nombreAuto = carro ? `${carro.marca} ${carro.modelo}` : `Unidad`;

      document.getElementById('qrTitulo').innerText = `${nombreAuto} (#${id})`;
      document.getElementById('qrcode').innerHTML = "";
      
      const linkCarro = `${BASE_URL_CATALOGO}#carro-${id}`;
      
      new QRCode(document.getElementById("qrcode"), {
        text: linkCarro,
        width: 180,
        height: 180
      });

      document.getElementById('qrModal').style.display = 'flex';
    }

    function descargarQR() {
      const qrContainer = document.getElementById('qrcode');
      const img = qrContainer.querySelector('img');
      const canvas = qrContainer.querySelector('canvas');

      let imageSrc = "";
      if (img && img.src) {
        imageSrc = img.src;
      } else if (canvas) {
        imageSrc = canvas.toDataURL("image/png");
      }

      if (!imageSrc) {
        alert("El código QR aún se está generando, intenta de nuevo.");
        return;
      }

      const link = document.createElement('a');
      link.href = imageSrc;
      link.download = `QR_Auto_${idActualQR}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function cerrarQR() {
      document.getElementById('qrModal').style.display = 'none';
    }
  </script>
</body>
</html>
