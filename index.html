<script>
const SUPABASE_URL = "https://xkhoorjntavmzhuikauj.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhraG9vcmpudGF2bXpodWlrYXVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3ODY2OTMsImV4cCI6MjEwMzM2MjY5M30.PHBKRKmvDtFMSE0Csy01Qo82s9e8DKXWBicf7JrSHz4";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let CARROS = [];
let TELEFONO_WHATSAPP = ""; 

const grid = document.getElementById('grid');
const viewCatalogo = document.getElementById('view-catalogo');
const viewFicha = document.getElementById('view-ficha');
const fichaContenido = document.getElementById('ficha-contenido');

const searchInput = document.getElementById('search');
if(searchInput) searchInput.addEventListener('input', pintarCatalogo);

function pintarCatalogo(){
  const term = (document.getElementById('search')?.value || '').trim().toLowerCase();

  const filtrados = CARROS.filter(c => {
    const texto = [
      c.id, c.marca, c.modelo, c.anio, c.estado, c.km
    ].join(' ').toLowerCase();
    return texto.includes(term);
  });

  const count = document.getElementById('unit-count');
  if(count) count.textContent = filtrados.length;

  if(!filtrados.length){
    grid.innerHTML = '<div class="empty-state">No encontramos unidades con esa búsqueda.</div>';
    return;
  }

  grid.innerHTML = filtrados.map(c => `
    <div class="card" onclick="location.hash='#/carro/${c.id}'">
      <div class="card-media">
        <span class="card-code">#${String(c.id).toUpperCase()}</span>
        <img src="${c.portada}" alt="${c.marca} ${c.modelo}" loading="lazy">
      </div>
      <div class="card-body">
        ${c.estado ? `<span class="badge badge-${String(c.estado).toLowerCase()}">${c.estado}</span>` : ''}
        <div class="card-title">${c.marca} ${c.modelo}</div>
        <div class="card-meta">${c.anio} · ${c.km || 'N/D'}</div>
      </div>
    </div>
  `).join('');
}

function actualizarEnlaceWhatsApp() {
  const btnWA = document.getElementById('btn-wa-link');
  if (btnWA && TELEFONO_WHATSAPP) {
    const urlActual = new URL(btnWA.href);
    const texto = urlActual.searchParams.get('text') || '';
    btnWA.href = `https://api.whatsapp.com/send?phone=${TELEFONO_WHATSAPP}&text=${encodeURIComponent(texto)}`;
  }
}

function pintarFicha(carro){
  const urlUnidad = `${location.origin}${location.pathname}#/carro/${carro.id}`;
  const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(urlUnidad)}`;
  
  const mensajeWA = `¡Hola! Me interesa la unidad ${carro.marca} ${carro.modelo} ${carro.anio}. ¿Sigue disponible?`;
  const urlWhatsApp = `https://api.whatsapp.com/send?phone=${TELEFONO_WHATSAPP}&text=${encodeURIComponent(mensajeWA)}`;

  const specsHtml = Object.entries(carro.specs || {}).map(([k,v]) => `
    <div class="spec-row"><span>${k}</span><span>${v}</span></div>
  `).join('');

  const visorHtml = carro.modelo3d
    ? `<model-viewer src="${carro.modelo3d}" camera-controls auto-rotate shadow-intensity="1"></model-viewer>`
    : `<model-viewer src="" poster="${carro.portada}" camera-controls></model-viewer>`;

  fichaContenido.innerHTML = `
    <div class="ficha-head">
      <div>
        <div class="ficha-title">${carro.marca} ${carro.modelo}</div>
        <div class="ficha-vin">UNIDAD #${String(carro.id).toUpperCase()} · ${carro.anio}</div>
      </div>
      <div class="qr-box">
        <img src="${qrSrc}" alt="QR de esta unidad">
        <div class="qr-label">ESCANEA PARA<br>VER DE NUEVO</div>
      </div>
    </div>
    <div class="ficha-body">
      <div class="visor">
        ${visorHtml}
        <div class="fotos">
         ${(carro.fotos || []).map(f => `<img src="${f}" onclick="abrirLightbox(this.src)">`).join('')}
        </div>
      </div>
      <div class="specs">
        <h3>Ficha técnica</h3>
        ${specsHtml}
        <div class="desc">${carro.descripcion || ''}</div>
        <a id="btn-wa-link" href="${urlWhatsApp}" target="_blank" class="btn-whatsapp">💬 Preguntar por WhatsApp</a>
      </div>
    </div>
  `;
}

function irACatalogo(){ location.hash = '#/'; }

function enrutar(){
  const hash = location.hash;
  if(hash.startsWith('#/carro/')){
    const id = hash.replace('#/carro/', '');
    const carro = CARROS.find(c => String(c.id) === id);
    if(carro){
      pintarFicha(carro);
      viewCatalogo.style.display = 'none';
      viewFicha.style.display = 'block';
      return;
    }
  }
  viewCatalogo.style.display = 'block';
  viewFicha.style.display = 'none';
}

async function cargarPerfilEmpresa(loteId) {
  if (!loteId) return;

  const { data: perfil, error } = await supabaseClient
    .from('perfiles')
    .select('*')
    .eq('id', loteId)
    .single();

  if (error || !perfil) {
    console.error("Error al cargar perfil del lote:", error);
    return;
  }

  const elNombre = document.getElementById('nombreEmpresa');
  if (elNombre && perfil.nombre_empresa) {
    elNombre.innerHTML = `${perfil.nombre_empresa} <span>/UNIDADES</span>`;
  }

  const logoEmpresa = document.getElementById('logoEmpresa');
  if (logoEmpresa && perfil.logo_url) {
    logoEmpresa.src = perfil.logo_url;
    logoEmpresa.style.display = 'block';
  }

  const imgLote = document.getElementById('imgLote');
  if (imgLote && perfil.logo_url) {
    imgLote.src = perfil.logo_url;
    imgLote.style.display = 'block';
  }

  // Soporta diferentes nombres comunes de columna por seguridad
  const rawWa = perfil.whatsapp || perfil.telefono || perfil.celular;

  if (rawWa) {
    let numClean = String(rawWa).replace(/[^0-9]/g, '');
    if (numClean.length === 10) {
      numClean = '52' + numClean;
    }
    TELEFONO_WHATSAPP = numClean;
    actualizarEnlaceWhatsApp();
  }
}

async function cargarCarros(){
  const urlParams = new URLSearchParams(window.location.search);
  const loteId = urlParams.get('lote');

  // Carga el perfil del lote en segundo plano
  const perfilPromise = loteId ? cargarPerfilEmpresa(loteId) : Promise.resolve();

  let query = supabaseClient.from('carros').select('*');
  if (loteId) {
    query = query.eq('empresa_id', loteId);
  }

  const { data, error } = await query;
  
  if(error){
    console.error('Error cargando carros:', error);
    return;
  }

  CARROS = data || [];
  
  // Asegura que el perfil esté cargado antes de dibujar la ruta
  await perfilPromise;

  window.addEventListener('hashchange', enrutar);
  pintarCatalogo();
  enrutar();
}

cargarCarros();

function abrirLightbox(src){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('activo');
}
function cerrarLightbox(){
  document.getElementById('lightbox').classList.remove('activo');
}
</script>
