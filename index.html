<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Unidades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --bg:#080a0d;
    --surface:#101419;
    --surface-2:#151a20;
    --surface-3:#1b2128;
    --line:rgba(255,255,255,.09);
    --line-strong:rgba(255,255,255,.15);
    --accent:#d7b56d;
    --accent-2:#f0d89b;
    --blue:#78a9d5;
    --text:#f5f5f3;
    --muted:#8e98a4;
    --success:#35c77a;
    --warning:#f0a04b;
    --danger:#e86666;
    --radius:18px;
    --shadow:0 18px 55px rgba(0,0,0,.28);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}

  body{
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background:
      radial-gradient(circle at 12% -10%, rgba(215,181,109,.13), transparent 32%),
      radial-gradient(circle at 90% 0%, rgba(120,169,213,.09), transparent 28%),
      var(--bg);
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:56px 56px;
    mask-image:linear-gradient(to bottom,black,transparent 75%);
  }

  header{
    position:sticky;
    top:0;
    z-index:50;
    padding:18px clamp(18px,4vw,56px);
    border-bottom:1px solid var(--line);
    background:rgba(8,10,13,.78);
    backdrop-filter:blur(18px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
  }

  .brand-wrap{display:flex;align-items:center;gap:14px}
  .brand-mark{
    width:42px;height:42px;border-radius:12px;
    display:grid;place-items:center;
    border:1px solid rgba(215,181,109,.35);
    background:linear-gradient(145deg,rgba(215,181,109,.2),rgba(215,181,109,.03));
    color:var(--accent-2);
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:20px;
  }

  .brand{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:28px;line-height:.9;
    letter-spacing:1px;text-transform:uppercase;
  }
  .brand span{color:var(--accent)}
  .brand-sub{
    margin-top:5px;
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;color:var(--muted);
    letter-spacing:1.8px;
  }

  main{max-width:1250px;margin:0 auto;padding:42px clamp(18px,4vw,36px) 90px}

  .catalog-hero{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:28px;margin-bottom:28px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    color:var(--accent);font-size:10px;
    letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;
  }
  .hero-title{
    font-family:'Barlow Condensed',sans-serif;
    font-size:clamp(42px,6vw,70px);
    line-height:.88;letter-spacing:-.5px;
    text-transform:uppercase;
  }
  .hero-title em{font-style:normal;color:var(--accent)}
  .lead{
    color:var(--muted);font-size:14px;line-height:1.6;
    max-width:590px;margin-top:14px;
  }
  .catalog-count{
    flex-shrink:0;text-align:right;
    font-family:'IBM Plex Mono',monospace;
    color:var(--muted);font-size:11px;
  }
  .catalog-count strong{
    display:block;color:var(--text);font-size:26px;
    margin-bottom:2px;
  }

  .toolbar{
    display:flex;gap:10px;margin-bottom:20px;
  }
  .search{
    flex:1;min-width:0;
    border:1px solid var(--line);
    background:rgba(255,255,255,.035);
    color:var(--text);
    border-radius:12px;
    padding:13px 15px;
    outline:none;
    font:500 13px 'Inter',sans-serif;
    transition:.2s;
  }
  .search:focus{
    border-color:rgba(215,181,109,.55);
    box-shadow:0 0 0 4px rgba(215,181,109,.07);
  }
  .search::placeholder{color:#68717c}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(275px,1fr));
    gap:18px;
  }

  .card{
    position:relative;overflow:hidden;
    background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
    border:1px solid var(--line);
    border-radius:var(--radius);
    cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.16);
    transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
  }
  .card:hover{
    transform:translateY(-5px);
    border-color:rgba(215,181,109,.35);
    box-shadow:var(--shadow);
  }

  .card-media{
    width:100%;aspect-ratio:4/3;
    background:#0b0e11;overflow:hidden;position:relative;
  }
  .card-media::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(0,0,0,.6),transparent 48%);
    pointer-events:none;
  }
  .card-media img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .5s ease;
  }
  .card:hover .card-media img{transform:scale(1.045)}

  .card-code{
    position:absolute;z-index:2;top:13px;left:13px;
    padding:6px 9px;border:1px solid rgba(255,255,255,.18);
    border-radius:8px;background:rgba(8,10,13,.72);
    backdrop-filter:blur(8px);
    color:var(--accent-2);
    font:600 10px 'IBM Plex Mono',monospace;
    letter-spacing:1px;
  }

  .card-body{padding:17px 17px 18px}
  .card-title{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;font-size:25px;line-height:1;
    text-transform:uppercase;letter-spacing:.4px;
  }
  .card-meta{
    font:11px 'IBM Plex Mono',monospace;
    color:var(--muted);margin-top:8px;
    letter-spacing:.4px;
  }

  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 8px;border-radius:999px;
    font-size:9px;font-weight:700;
    letter-spacing:1px;text-transform:uppercase;
    margin-bottom:10px;border:1px solid transparent;
  }
  .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .badge-disponible{background:rgba(53,199,122,.1);color:var(--success);border-color:rgba(53,199,122,.2)}
  .badge-reservado{background:rgba(240,160,75,.1);color:var(--warning);border-color:rgba(240,160,75,.2)}
  .badge-vendido{background:rgba(232,102,102,.1);color:var(--danger);border-color:rgba(232,102,102,.2)}
  .badge-garantia{background:rgba(120,169,213,.1);color:var(--blue);border-color:rgba(120,169,213,.2)}

  #view-ficha{display:none}
  .back-btn{
    display:inline-flex;align-items:center;gap:8px;
    font:600 10px 'IBM Plex Mono',monospace;
    color:var(--muted);background:none;border:0;cursor:pointer;
    text-transform:uppercase;letter-spacing:1.2px;margin-bottom:18px;
    padding:7px 0;transition:.2s;
  }
  .back-btn:hover{color:var(--accent)}

  .ficha{
    overflow:hidden;border:1px solid var(--line);
    border-radius:22px;background:rgba(255,255,255,.025);
    box-shadow:var(--shadow);
  }
  .ficha-head{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:20px;padding:26px 28px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(100deg,rgba(215,181,109,.07),transparent 50%);
  }
  .ficha-title{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:clamp(38px,5vw,58px);
    text-transform:uppercase;line-height:.88;letter-spacing:-.3px;
  }
  .ficha-vin{
    font:10px 'IBM Plex Mono',monospace;color:var(--muted);
    margin-top:10px;letter-spacing:1.3px;
  }

  .qr-box{
    text-align:center;flex-shrink:0;padding:8px;
    border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035);
  }
  .qr-box img{width:82px;height:82px;background:#fff;padding:5px;display:block;border-radius:8px}
  .qr-box .qr-label{
    font:8px 'IBM Plex Mono',monospace;color:var(--muted);
    margin-top:6px;letter-spacing:1px;line-height:1.3;
  }

  .ficha-body{display:grid;grid-template-columns:1.2fr 1fr}
  @media (max-width:820px){.ficha-body{grid-template-columns:1fr}}
  .visor{padding:22px;border-right:1px solid var(--line)}
  @media (max-width:820px){.visor{border-right:0;border-bottom:1px solid var(--line)}}
  .visor model-viewer{
    width:100%;height:380px;background:#0a0d10;
    border:1px solid var(--line);border-radius:15px;
    --poster-color:#0a0d10;
  }
  .fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .fotos img{
    width:100%;aspect-ratio:1/1;object-fit:cover;
    border:1px solid var(--line);border-radius:10px;
    cursor:pointer;transition:.2s;
  }
  .fotos img:hover{opacity:.8;transform:translateY(-2px)}

  .specs{padding:26px}
  .specs h3{
    font:600 10px 'IBM Plex Mono',monospace;
    text-transform:uppercase;letter-spacing:2px;
    color:var(--accent);margin-bottom:13px;
  }
  .spec-row{
    display:flex;justify-content:space-between;gap:20px;
    padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;
  }
  .spec-row span:first-child{color:var(--muted)}
  .spec-row span:last-child{
    font:500 12px 'IBM Plex Mono',monospace;text-align:right;
  }
  .desc{margin-top:22px;font-size:13px;line-height:1.7;color:#c9ced3}
  .btn-whatsapp{
    display:flex;align-items:center;justify-content:center;gap:9px;
    background:#20c96b;color:#07120b;text-decoration:none;
    font-weight:800;padding:14px 20px;border-radius:11px;
    margin-top:20px;font-size:13px;
    box-shadow:0 8px 24px rgba(32,201,107,.15);
    transition:.2s;
  }
  .btn-whatsapp:hover{background:#36dc7d;transform:translateY(-2px)}

  .lightbox{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,.94);z-index:999;
    align-items:center;justify-content:center;padding:25px;
    backdrop-filter:blur(8px);
  }
  .lightbox.activo{display:flex}
  .lightbox img{max-width:95%;max-height:90vh;object-fit:contain;border-radius:10px}
  .lightbox-cerrar{
    position:absolute;top:18px;right:22px;color:#fff;
    font-size:34px;background:none;border:0;cursor:pointer;
    opacity:.75;transition:.2s;
  }
  .lightbox-cerrar:hover{opacity:1;color:var(--accent)}

  .empty-state{
    grid-column:1/-1;padding:55px 20px;text-align:center;
    border:1px dashed var(--line-strong);border-radius:16px;color:var(--muted);
  }

  @media (max-width:620px){
    header{padding:15px 16px}
    .brand{font-size:24px}
    main{padding-top:30px}
    .catalog-hero{align-items:flex-start;flex-direction:column;gap:14px}
    .catalog-count{text-align:left}
    .ficha-head{padding:21px}
    .visor,.specs{padding:17px}
    .visor model-viewer{height:300px}
  }
</style>

</head>
<body>

<header>
  <div class="brand-wrap">
    <div class="brand-mark">MONROY</div>
    <div>
      <div class="brand">CATÁLOGO <span>/UNIDADES</span></div>
      <div class="brand-sub">ESCANEA · CONSULTA · COMPARA</div>
    </div>
  </div>
</header>

<main>

  <!-- ==================== VISTA 1: CATÁLOGO ==================== -->
  <section id="view-catalogo">
  <div class="catalog-hero" style="display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: space-between !important; gap: 10px !important;">
      <div style="flex: 1; min-width: 0;">
        <div class="eyebrow">Inventario seleccionado</div>
        <h1 class="hero-title" style="font-size: 1.4rem; line-height: 1.2;">Encuentra tu <em>próxima</em> unidad.</h1>
        <div class="lead" style="font-size: 0.8rem; margin-top: 4px;">Explora el inventario y consulta las especificaciones.</div>
      </div>
      <div style="width: 130px; flex-shrink: 0;">
        <img src="logo.jpg" alt="Monroy" style="width: 100%; height: auto; display: block; object-fit: contain; mix-blend-mode: screen;">
      </div>
    </div>
    <div class="catalog-count"><strong id="unit-count">0</strong> UNIDADES EN INVENTARIO</div>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Buscar por marca, modelo, año o código..." autocomplete="off">
    </div>

    <div class="grid" id="grid"></div>
  </section>

  <!-- ==================== VISTA 2: FICHA DE UN CARRO ==================== -->
  <section id="view-ficha">
    <button class="back-btn" onclick="irACatalogo()">&larr; volver al catálogo</button>
    <div class="ficha" id="ficha-contenido"></div>
  </section>
  
  <div class="lightbox" id="lightbox" onclick="cerrarLightbox()">
  <button class="lightbox-cerrar" onclick="cerrarLightbox()">&times;</button>
  <img id="lightbox-img" src="">
</div>

</main>

<script>
/* =====================================================================
   1) TUS DATOS — edita este arreglo para agregar/quitar vehículos.
      "id" debe ser único y sin espacios (se usa en la URL y en el QR).
   ===================================================================== */
const SUPABASE_URL = "https://xkhoorjntavmzhuikauj.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhraG9vcmpudGF2bXpodWlrYXVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3ODY2OTMsImV4cCI6MjEwMzM2MjY5M30.PHBKRKmvDtFMSE0Csy01Qo82s9e8DKXWBicf7JrSHz4";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let CARROS = [];

async function cargarCarrosDesdeBD() {
  const { data, error } = await supabaseClient.from('carros').select('*');
  
  if (error) {
    console.error('Error al traer los datos de Supabase:', error);
    return;
  }

  CARROS = data;
  pintarCatalogo();
}

// Carga principal realizada al final del script.
/* =====================================================================
   2) NO NECESITAS TOCAR NADA DE AQUÍ PARA ABAJO
   ===================================================================== */
const grid = document.getElementById('grid');
const viewCatalogo = document.getElementById('view-catalogo');
const viewFicha = document.getElementById('view-ficha');
const fichaContenido = document.getElementById('ficha-contenido');

const searchInput = document.getElementById('search');
if(searchInput) searchInput.addEventListener('input', pintarCatalogo);

function pintarCatalogo(){
  const term = (document.getElementById('search')?.value || '').trim().toLowerCase();

  const filtrados = CARROS.filter(c => {
    const texto = [
      c.id, c.marca, c.modelo, c.anio, c.estado,
      c.specs?.["Kilometraje"] || ''
    ].join(' ').toLowerCase();
    return texto.includes(term);
  });

  const count = document.getElementById('unit-count');
  if(count) count.textContent = filtrados.length;

  if(!filtrados.length){
    grid.innerHTML = '<div class="empty-state">No encontramos unidades con esa búsqueda.</div>';
    return;
  }

  grid.innerHTML = filtrados.map(c => `
    <div class="card" onclick="location.hash='#/carro/${c.id}'">
      <div class="card-media">
        <span class="card-code">#${c.id.toUpperCase()}</span>
        <img src="${c.portada}" alt="${c.marca} ${c.modelo}" loading="lazy">
      </div>
      <div class="card-body">
        ${c.estado ? `<span class="badge badge-${String(c.estado).toLowerCase()}">${c.estado}</span>` : ''}
        <div class="card-title">${c.marca} ${c.modelo}</div>
        <div class="card-meta">${c.anio} · ${c.specs?.["Kilometraje"] || ''}</div>
      </div>
    </div>
  `).join('');
}

function pintarFicha(carro){
  const urlUnidad = `${location.origin}${location.pathname}#/carro/${carro.id}`;
  const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(urlUnidad)}`;
  const telefonoLote = "525655486039"; 
  const mensajeWA = encodeURIComponent(`¡Hola! Me interesa la unidad ${carro.marca} ${carro.modelo} ${carro.anio}. ¿Sigue disponible?`);
  const urlWhatsApp = `https://wa.me/${telefonoLote}?text=${mensajeWA}`;

  const specsHtml = Object.entries(carro.specs).map(([k,v]) => `
    <div class="spec-row"><span>${k}</span><span>${v}</span></div>
  `).join('');

  const visorHtml = carro.modelo3d
    ? `<model-viewer src="${carro.modelo3d}" camera-controls auto-rotate shadow-intensity="1"></model-viewer>`
    : `<model-viewer src="" poster="${carro.portada}" camera-controls></model-viewer>`;

  fichaContenido.innerHTML = `
    <div class="ficha-head">
      <div>
        <div class="ficha-title">${carro.marca} ${carro.modelo}</div>
        <div class="ficha-vin">UNIDAD #${carro.id.toUpperCase()} · ${carro.anio}</div>
      </div>
      <div class="qr-box">
        <img src="${qrSrc}" alt="QR de esta unidad">
        <div class="qr-label">ESCANEA PARA<br>VER DE NUEVO</div>
      </div>
    </div>
    <div class="ficha-body">
      <div class="visor">
        ${visorHtml}
        <div class="fotos">
         ${carro.fotos.map(f => `<img src="${f}" onclick="abrirLightbox(this.src)">`).join('')}
        </div>
      </div>
      <div class="specs">
        <h3>Ficha técnica</h3>
        ${specsHtml}
        <div class="desc">${carro.descripcion}</div>
        <a href="${urlWhatsApp}" target="_blank" class="btn-whatsapp">💬 Preguntar por WhatsApp</a>
      </div>
    </div>
  `;
}

function irACatalogo(){ location.hash = '#/'; }

function enrutar(){
  const hash = location.hash;
  if(hash.startsWith('#/carro/')){
    const id = hash.replace('#/carro/', '');
    const carro = CARROS.find(c => c.id === id);
    if(carro){
      pintarFicha(carro);
      viewCatalogo.style.display = 'none';
      viewFicha.style.display = 'block';
      return;
    }
  }
  viewCatalogo.style.display = 'block';
  viewFicha.style.display = 'none';
}

async function cargarCarros(){
  const { data, error } = await supabaseClient.from('carros').select('*');
  if(error){
    console.error('Error cargando carros:', error);
    return;
  }
  CARROS = data;
  window.addEventListener('hashchange', enrutar);
  pintarCatalogo();
  enrutar();
}
cargarCarros();
  function abrirLightbox(src){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('activo');
}
function cerrarLightbox(){
  document.getElementById('lightbox').classList.remove('activo');
}
</script>

</body>
</html>
